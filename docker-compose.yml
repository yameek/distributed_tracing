version: '3.8'

services:
  # RabbitMQ - Message Broker
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tracing-network

  # Grafana Tempo - Distributed Tracing Backend
  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo-config.yaml:/etc/tempo.yaml
      - tempo-data:/tmp/tempo
    ports:
      - "4318:4318"  # OTLP HTTP
      - "3200:3200"  # Tempo HTTP API
    networks:
      - tracing-network

  # Grafana - Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
    networks:
      - tracing-network
    depends_on:
      - tempo

  # Service A - API Gateway
  service-a:
    build:
      context: ./service-a
      dockerfile: Dockerfile
    container_name: service-a
    ports:
      - "8080:8080"
    environment:
      - SPRING_APPLICATION_NAME=service-a
      - MANAGEMENT_OTLP_TRACING_ENDPOINT=http://tempo:4318/v1/traces
      - SERVICE_B_URL=http://service-b:8081
    networks:
      - tracing-network
    depends_on:
      - tempo

  # Service B - Order Service
  service-b:
    build:
      context: ./service-b
      dockerfile: Dockerfile
    container_name: service-b
    ports:
      - "8081:8081"
    environment:
      - SPRING_APPLICATION_NAME=service-b
      - MANAGEMENT_OTLP_TRACING_ENDPOINT=http://tempo:4318/v1/traces
      - SERVICE_C_URL=http://service-c:8082
      - SERVICE_D_URL=http://service-d:8083
    networks:
      - tracing-network
    depends_on:
      - tempo

  # Service C - Inventory Service
  service-c:
    build:
      context: ./service-c
      dockerfile: Dockerfile
    container_name: service-c
    ports:
      - "8082:8082"
    environment:
      - SPRING_APPLICATION_NAME=service-c
      - MANAGEMENT_OTLP_TRACING_ENDPOINT=http://tempo:4318/v1/traces
      - SERVICE_D_URL=http://service-d:8083
    networks:
      - tracing-network
    depends_on:
      - tempo

  # Service D - Notification Service
  service-d:
    build:
      context: ./service-d
      dockerfile: Dockerfile
    container_name: service-d
    ports:
      - "8083:8083"
    environment:
      - SPRING_APPLICATION_NAME=service-d
      - MANAGEMENT_OTLP_TRACING_ENDPOINT=http://tempo:4318/v1/traces
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
      - SERVICE_A_URL=http://service-a:8080
    networks:
      - tracing-network
    depends_on:
      rabbitmq:
        condition: service_healthy
      tempo:
        condition: service_started

networks:
  tracing-network:
    driver: bridge

volumes:
  tempo-data:
  grafana-data:
